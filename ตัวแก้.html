<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Hunter</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #f9fafb;
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    canvas {
      border: 3px solid #38bdf8;
      background: #0f172a;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }
    .hint {
      font-size: 14px;
      color: #cbd5e1;
      text-align: center;
      max-width: 780px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="800" height="600"></canvas>
    <div class="hint">WASD / ลูกศร = เคลื่อนที่ • ESC = หยุดเกม • B = ร้านค้า • 1/2/3 = ซื้อไอเทม</div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const saveKey = "crystal-hunter-save-v1";
    const rarityData = [
      { name: "common", color: "#38bdf8", value: 10, label: "Common" },
      { name: "rare", color: "#4ade80", value: 25, label: "Rare" },
      { name: "epic", color: "#a855f7", value: 50, label: "Epic" },
      { name: "legendary", color: "#facc15", value: 100, label: "Legendary" }
    ];

    const keys = {};
    let paused = false;
    let shopOpen = false;
    let particles = [];
    let lastTime = 0;

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createPlayer() {
      return {
        x: 100,
        y: 100,
        size: 28,
        speed: 5,
        hp: 100,
        maxHp: 100,
        level: 1,
        score: 0,
        weapon: { name: "Iron Sword", damage: 10 },
        inventory: { common: 0, rare: 0, epic: 0, legendary: 0 },
        upgrades: { hp: 0, speed: 0, damage: 0 }
      };
    }

    function createEnemy() {
      return {
        x: randomRange(50, canvas.width - 50),
        y: randomRange(50, canvas.height - 50),
        size: 28,
        speed: 1.6 + Math.random() * 0.8,
        lastHit: 0,
        hitCooldown: 1000
      };
    }

    function createCrystal() {
      const roll = Math.random();
      let rarity;
      if (roll < 0.6) rarity = rarityData[0];
      else if (roll < 0.85) rarity = rarityData[1];
      else if (roll < 0.95) rarity = rarityData[2];
      else rarity = rarityData[3];

      return {
        x: randomRange(40, canvas.width - 40),
        y: randomRange(40, canvas.height - 40),
        size: 18,
        rarity
      };
    }

    function defaultGameState() {
      return {
        player: createPlayer(),
        enemies: Array.from({ length: 5 }, createEnemy),
        crystal: createCrystal(),
        paused: false,
        shopOpen: false,
        lastSavedAt: 0,
        highScore: Number(localStorage.getItem("highscore") || 0)
      };
    }

    let game = loadGame();

    function loadGame() {
      try {
        const raw = localStorage.getItem(saveKey);
        if (!raw) return defaultGameState();
        const parsed = JSON.parse(raw);
        const state = defaultGameState();
        state.player = { ...state.player, ...parsed.player };
        state.player.inventory = { ...state.player.inventory, ...parsed.player?.inventory };
        state.player.weapon = { ...state.player.weapon, ...parsed.player?.weapon };
        state.player.upgrades = { ...state.player.upgrades, ...parsed.player?.upgrades };
        state.crystal = parsed.crystal || state.crystal;
        state.enemies = Array.isArray(parsed.enemies) && parsed.enemies.length ? parsed.enemies : state.enemies;
        state.highScore = Number(parsed.highScore || localStorage.getItem("highscore") || 0);
        return state;
      } catch (error) {
        console.warn("Load failed", error);
        return defaultGameState();
      }
    }

    function saveGame() {
      const data = {
        player: game.player,
        enemies: game.enemies,
        crystal: game.crystal,
        highScore: game.highScore
      };
      localStorage.setItem(saveKey, JSON.stringify(data));
      localStorage.setItem("highscore", String(game.highScore));
    }

    function resetGame() {
      game = defaultGameState();
      saveGame();
    }

    function playSound(name) {
      try {
        const sound = new Audio(name);
        sound.volume = 0.25;
        sound.play().catch(() => {});
      } catch (error) {
        // Ignore missing or blocked audio files.
      }
    }

    function updateLevel() {
      const nextLevel = 1 + Math.floor(game.player.score / 200);
      if (nextLevel > game.player.level) {
        game.player.level = nextLevel;
        game.player.maxHp += 12;
        game.player.hp = game.player.maxHp;
        game.enemies = Array.from({ length: 5 + game.player.level }, createEnemy);
        playSound("levelup.wav");
        saveGame();
      }
    }

    function buyUpgrade(type) {
      const cost = 100;
      if (game.player.score < cost) return;

      game.player.score -= cost;
      if (type === "hp") {
        game.player.maxHp += 15;
        game.player.hp = game.player.maxHp;
        game.player.upgrades.hp += 1;
      } else if (type === "speed") {
        game.player.speed += 1;
        game.player.upgrades.speed += 1;
      } else if (type === "damage") {
        game.player.weapon.damage += 3;
        game.player.upgrades.damage += 1;
      }
      saveGame();
      playSound("collect.wav");
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x,
          y,
          vx: randomRange(-2, 2),
          vy: randomRange(-2, 2),
          life: 30,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function handlePlayerMovement() {
      if (keys["arrowup"] || keys["w"]) game.player.y -= game.player.speed;
      if (keys["arrowdown"] || keys["s"]) game.player.y += game.player.speed;
      if (keys["arrowleft"] || keys["a"]) game.player.x -= game.player.speed;
      if (keys["arrowright"] || keys["d"]) game.player.x += game.player.speed;

      game.player.x = Math.max(0, Math.min(canvas.width - game.player.size, game.player.x));
      game.player.y = Math.max(0, Math.min(canvas.height - game.player.size, game.player.y));
    }

    function updateEnemies(delta) {
      const playerCenterX = game.player.x + game.player.size / 2;
      const playerCenterY = game.player.y + game.player.size / 2;

      game.enemies.forEach((enemy) => {
        const ex = playerCenterX - (enemy.x + enemy.size / 2);
        const ey = playerCenterY - (enemy.y + enemy.size / 2);
        const dist = Math.hypot(ex, ey);

        if (dist > 0.001) {
          enemy.x += (ex / dist) * enemy.speed;
          enemy.y += (ey / dist) * enemy.speed;
        }

        const hitDist = Math.hypot(game.player.x - enemy.x, game.player.y - enemy.y);
        if (hitDist < game.player.size / 2 + enemy.size / 2 && performance.now() - enemy.lastHit >= enemy.hitCooldown) {
          game.player.hp -= Math.max(4, 8 + game.player.level * 0.5);
          enemy.lastHit = performance.now();
          playSound("hit.wav");
        }
      });

      if (game.player.hp <= 0) {
        game.player.hp = 0;
        game.highScore = Math.max(game.highScore, game.player.score);
        saveGame();
        alert("Game Over! ลองเล่นใหม่อีกครั้ง");
        resetGame();
      }
    }

    function updateCrystal() {
      const pCenterX = game.player.x + game.player.size / 2;
      const pCenterY = game.player.y + game.player.size / 2;
      const cCenterX = game.crystal.x + game.crystal.size / 2;
      const cCenterY = game.crystal.y + game.crystal.size / 2;
      const dx = pCenterX - cCenterX;
      const dy = pCenterY - cCenterY;
      const dist = Math.hypot(dx, dy);

      if (dist < game.player.size / 2 + game.crystal.size / 2) {
        const reward = game.crystal.rarity.value;
        game.player.score += reward;
        game.player.inventory[game.crystal.rarity.name] += 1;
        game.player.hp = Math.min(game.player.maxHp, game.player.hp + 3);
        spawnParticles(game.crystal.x, game.crystal.y, game.crystal.rarity.color);
        playSound("collect.wav");
        updateLevel();
        game.crystal = createCrystal();
        saveGame();
      }
    }

    function update(dt) {
      if (paused || shopOpen) return;
      handlePlayerMovement();
      updateEnemies(dt);
      updateCrystal();
      updateParticles();
    }

    function drawHud() {
      ctx.save();
      ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
      ctx.fillRect(12, 12, 260, 150);
      ctx.strokeStyle = "#38bdf8";
      ctx.strokeRect(12, 12, 260, 150);

      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 16px Segoe UI";
      ctx.fillText(`HP ${Math.floor(game.player.hp)} / ${game.player.maxHp}`, 24, 40);
      ctx.fillText(`Level ${game.player.level}`, 24, 66);
      ctx.fillText(`Score ${game.player.score}`, 24, 92);
      ctx.fillText(`Weapon ${game.player.weapon.name} +${game.player.weapon.damage}`, 24, 118);
      ctx.fillText(`High Score ${game.highScore}`, 24, 144);

      const barWidth = 180;
      const ratio = game.player.hp / game.player.maxHp;
      ctx.fillStyle = "#334155";
      ctx.fillRect(24, 50, barWidth, 12);
      ctx.fillStyle = ratio > 0.35 ? "#22c55e" : "#ef4444";
      ctx.fillRect(24, 50, barWidth * ratio, 12);
      ctx.restore();
    }

    function drawInventory() {
      ctx.save();
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(520, 12, 268, 150);
      ctx.strokeStyle = "#f59e0b";
      ctx.strokeRect(520, 12, 268, 150);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 16px Segoe UI";
      ctx.fillText("Inventory", 536, 36);
      ctx.font = "14px Segoe UI";
      ctx.fillText(`Common: ${game.player.inventory.common}`, 536, 60);
      ctx.fillText(`Rare: ${game.player.inventory.rare}`, 536, 82);
      ctx.fillText(`Epic: ${game.player.inventory.epic}`, 536, 104);
      ctx.fillText(`Legendary: ${game.player.inventory.legendary}`, 536, 126);
      ctx.restore();
    }

    function drawShop() {
      if (!shopOpen) return;
      ctx.save();
      ctx.fillStyle = "rgba(2, 6, 23, 0.92)";
      ctx.fillRect(150, 140, 500, 240);
      ctx.strokeStyle = "#38bdf8";
      ctx.strokeRect(150, 140, 500, 240);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 22px Segoe UI";
      ctx.fillText("Shop", 180, 180);
      ctx.font = "16px Segoe UI";
      ctx.fillText("1) HP +15 (100 score)", 180, 220);
      ctx.fillText("2) Speed +1 (100 score)", 180, 250);
      ctx.fillText("3) Damage +3 (100 score)", 180, 280);
      ctx.fillText("Press B to close", 180, 320);
      ctx.restore();
    }

    function drawPauseOverlay() {
      if (!paused) return;
      ctx.save();
      ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 36px Segoe UI";
      ctx.fillText("Paused", 320, 270);
      ctx.font = "18px Segoe UI";
      ctx.fillText("Press ESC to continue", 280, 310);
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#22c55e";
      ctx.fillRect(game.player.x, game.player.y, game.player.size, game.player.size);

      game.enemies.forEach((enemy) => {
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
      });

      const crystal = game.crystal;
      ctx.fillStyle = crystal.rarity.color;
      ctx.fillRect(crystal.x, crystal.y, crystal.size, crystal.size);

      particles.forEach((p) => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      });

      drawHud();
      drawInventory();
      drawShop();
      drawPauseOverlay();
    }

    function gameLoop(timestamp) {
      const delta = timestamp - lastTime;
      lastTime = timestamp;
      update(delta);
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === "Escape") {
        paused = !paused;
        saveGame();
      }
      if (e.key === "b" || e.key === "B") {
        shopOpen = !shopOpen;
      }
      if (shopOpen) {
        if (e.key === "1") buyUpgrade("hp");
        if (e.key === "2") buyUpgrade("speed");
        if (e.key === "3") buyUpgrade("damage");
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    window.addEventListener("beforeunload", saveGame);

    saveGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
